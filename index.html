<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#ffffff"/>
<title>Daily Brief</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;font-family:-apple-system,"Helvetica Neue",sans-serif;min-height:100vh;color:#000;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:2px solid #000;position:sticky;top:0;background:#fff;z-index:10}
.clock{font-family:"Courier New",monospace;font-size:32px;font-weight:900;color:#000;letter-spacing:-0.02em}
.colon{animation:blink 1s step-end infinite}
.sl{font-family:"Courier New",monospace;font-size:10px;font-weight:700;letter-spacing:.15em;color:#555;text-align:right}
.sd{font-family:"Courier New",monospace;font-size:10px;font-weight:700;letter-spacing:.1em;margin-top:2px;text-align:right}
.datestrip{padding:10px 20px;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:space-between}
.dt{font-family:"Courier New",monospace;font-size:11px;font-weight:700;letter-spacing:.12em;color:#000}
.dots{display:flex;gap:5px}
.dot{width:4px;height:4px;border-radius:50%}
.tabs{display:flex;border-bottom:2px solid #000}
.tab{flex:1;padding:12px 4px;font-family:"Courier New",monospace;font-size:10px;font-weight:900;letter-spacing:.12em;text-align:center;cursor:pointer;border:none;background:#fff;color:#888;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.on{color:#000;border-bottom-color:#FF3C00}
.page{display:none}.page.on{display:block}
/* BRIEF */
.cta{padding:32px 20px 24px}
.ey{font-family:"Courier New",monospace;font-size:12px;font-weight:900;letter-spacing:.2em;color:#555;margin-bottom:8px}
.hl{font-size:24px;font-weight:900;color:#000;line-height:1.2;margin-bottom:24px}
.gbtn{width:100%;padding:18px 20px;background:#000;color:#fff;border:none;font-family:"Courier New",monospace;font-size:13px;font-weight:900;letter-spacing:.2em;cursor:pointer;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.arr{color:#FF3C00;font-size:18px}
.csub{margin-top:10px;font-family:"Courier New",monospace;font-size:10px;font-weight:700;color:#888;letter-spacing:.12em}
.secs{padding:6px 20px 60px}
.rrow{display:flex;justify-content:flex-end;padding:10px 0 14px}
.rbtn{background:none;border:1.5px solid #999;font-family:"Courier New",monospace;font-size:10px;font-weight:700;color:#555;letter-spacing:.14em;padding:7px 16px;cursor:pointer}
.card{border-top:1.5px solid #bbb;border-left:3px solid transparent;padding:0 0 0 14px;transition:border-color .2s}
.card.live{border-left-color:var(--acc);border-top-color:#000}
.ch{display:flex;align-items:center;justify-content:space-between;padding:13px 0 5px;cursor:pointer;user-select:none}
.chl{display:flex;align-items:center;gap:10px}
.ci{font-family:"Courier New",monospace;font-size:15px;font-weight:900}
.ct{font-family:"Courier New",monospace;font-size:12px;font-weight:900;letter-spacing:.2em;color:#000}
.ctag{font-family:"Courier New",monospace;font-size:10px;font-weight:700;letter-spacing:.1em}
.ctog{font-family:"Courier New",monospace;font-size:16px;font-weight:700;color:#555}
.cb{padding:3px 0 16px}
.sk{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.skl{height:10px;border-radius:2px;background:linear-gradient(90deg,#ebebeb 25%,#ddd 50%,#ebebeb 75%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite}
.con{font-size:14px;line-height:1.7;color:#111}
.con p{margin:0 0 1px}
.con p.caps{margin:10px 0 2px;font-weight:900;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.1em;color:#000}
.er{font-family:"Courier New",monospace;font-size:11px;font-weight:700;color:#FF3C00;padding:8px 0;line-height:1.5}
.ft{margin-top:28px}
.ftl{margin-top:8px;font-family:"Courier New",monospace;font-size:9px;font-weight:700;color:#bbb;letter-spacing:.15em}
/* ASSISTANT */
#p1{display:none;flex-direction:column;height:calc(100vh - 118px)}
#p1.on{display:flex}
.ams{flex:1;overflow-y:auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:90%;padding:10px 14px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.u{background:#000;color:#fff;align-self:flex-end;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.04em}
.msg.a{background:#f5f5f5;color:#111;align-self:flex-start;border-left:3px solid #FF3C00}
.ml{font-family:"Courier New",monospace;font-size:9px;font-weight:700;letter-spacing:.14em;color:#FF3C00;margin-bottom:4px}
.msg.u.file{background:#222;font-size:11px;display:flex;align-items:center;gap:8px}
.file-icon{font-size:18px}
/* input bar */
.air{border-top:2px solid #000;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.air-row{display:flex;gap:8px;align-items:center}
.ai{flex:1;border:1.5px solid #ccc;padding:11px 14px;font-family:"Courier New",monospace;font-size:13px;color:#000;outline:none;background:#fff;min-width:0}
.ai:focus{border-color:#000}
.icnbtn{width:42px;height:42px;border:1.5px solid #ccc;background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.icnbtn:active,.icnbtn.rec{border-color:#FF3C00;background:#fff8f7}
.icnbtn.send{background:#000;border-color:#000;color:#FF3C00;font-size:16px;font-weight:900}
.attach-bar{display:flex;gap:8px;align-items:center;padding:2px 0}
.attach-label{font-family:"Courier New",monospace;font-size:9px;font-weight:700;letter-spacing:.12em;color:#888}
.attach-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #ddd;font-family:"Courier New",monospace;font-size:10px;color:#555;cursor:pointer}
.attach-chip:hover{border-color:#000;color:#000}
#fileInput{display:none}
.preview-bar{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid #eee}
.preview-name{font-family:"Courier New",monospace;font-size:10px;color:#555;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-rm{background:none;border:none;font-size:14px;color:#FF3C00;cursor:pointer;font-weight:900;padding:0 4px}
.ty{display:flex;gap:5px;padding:4px 0;align-items:center}
.ty span{width:6px;height:6px;border-radius:50%;background:#999;animation:pu 1.2s ease-in-out infinite}
.ty span:nth-child(2){animation-delay:.2s}
.ty span:nth-child(3){animation-delay:.4s}
.rec-indicator{font-family:"Courier New",monospace;font-size:10px;color:#FF3C00;font-weight:700;letter-spacing:.1em;animation:blink .7s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,99%{opacity:0}}
@keyframes sh{0%,100%{background-position:200% 0}50%{background-position:-200% 0}}
@keyframes pu{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="clock" id="clk">--<span class="colon">:</span>--</div>
    <div><div class="sl">DAILY.BRIEF</div><div class="sd" id="sd">&#9679; STANDBY</div></div>
  </div>
  <div class="datestrip">
    <span class="dt" id="dtxt"></span>
    <div class="dots" id="drow"></div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tab0" onclick="sw(0)">&#9675; BRIEF</button>
    <button class="tab" id="tab1" onclick="sw(1)">&#9670; ASSISTANT</button>
  </div>

  <!-- BRIEF PAGE -->
  <div class="page on" id="p0"><div id="bm"></div></div>

  <!-- ASSISTANT PAGE -->
  <div id="p1">
    <div class="ams" id="am">
      <div class="msg a">
        <div class="ml">ASSISTANT_</div>
        Good morning. I can help with Google Calendar, Gmail, Drive, Docs, Sheets, Maps, YouTube &mdash; or anything else. Type, speak, or attach a file.
      </div>
    </div>
    <div class="air">
      <div class="air-row">
        <input class="ai" id="ainp" placeholder="Ask anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"/>
        <button class="icnbtn" id="micBtn" onclick="toggleVoice()" title="Voice input">&#127908;</button>
        <button class="icnbtn send" onclick="send()" title="Send">&#8594;</button>
      </div>
      <div class="attach-bar">
        <span class="attach-label">ATTACH:</span>
        <label class="attach-chip" for="fileInput">&#128206; FILE</label>
        <label class="attach-chip" for="fileInput">&#128247; IMAGE</label>
        <input type="file" id="fileInput" accept="*/*" onchange="onFile(event)"/>
      </div>
      <div class="preview-bar" id="prevBar" style="display:none">
        <span style="font-size:16px" id="prevIcon">&#128206;</span>
        <span class="preview-name" id="prevName"></span>
        <button class="preview-rm" onclick="clearFile()">&#10005;</button>
      </div>
    </div>
  </div>
</div>

<script>
// Clock
function tick(){
  var t=new Date(),h=String(t.getHours()).padStart(2,'0'),m=String(t.getMinutes()).padStart(2,'0');
  document.getElementById('clk').innerHTML=h+'<span class="colon">:</span>'+m;
}
tick();setInterval(tick,30000);

// Date
var now=new Date();
var DS=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
document.getElementById('dtxt').textContent=DS.toUpperCase();
var dr=document.getElementById('drow');
for(var i=0;i<10;i++){var d=document.createElement('div');d.className='dot';d.style.background=i%3===0?'#000':'#ccc';dr.appendChild(d);}

// API key
var _a='sk-ant-api03-tWH-ENa',_b='wMS6kDQOB20DKYIMnYn7KUjjhP83te',_c='DA0kMfpt-n4eHiDk1Mr0h73HXScVODiZuvRMF0hdGgBee4dXw-uYEoYwAA';
var AK=_a+_b+_c;

// Tabs
function sw(i){
  document.getElementById('tab0').classList.toggle('on',i===0);
  document.getElementById('tab1').classList.toggle('on',i===1);
  document.getElementById('p0').classList.toggle('on',i===0);
  document.getElementById('p1').classList.toggle('on',i===1);
}

// Brief sections (NO AGENDA)
var SECS=[
  {id:'weather',label:'WEATHER',icon:'&#9675;',acc:'#FF3C00'},
  {id:'world',label:'WORLD',icon:'&#9677;',acc:'#000'},
  {id:'local',label:'LOCAL',icon:'&#9672;',acc:'#000'},
  {id:'ai',label:'AI + STARTUPS',icon:'&#9670;',acc:'#FF3C00'}
];

function getP(id,loc){
  var l=loc||'unknown location';
  return {
    weather:'Today: '+DS+'. Location: '+l+'. Weather briefing. Start with data, no preamble.\nWEATHER - [CITY]\nNow: [temp C/F, condition]\nMorning: [brief]\nAfternoon: [brief]\nEvening: [brief]\nTip: [one tip]\nPlain text only. Max 120 words.',
    world:'Today: '+DS+'. Top 4 world news stories right now. Each:\n[HEADLINE CAPS]\n[2 sentences]\nNo intro. Plain text. Max 200 words.',
    local:'Today: '+DS+'. Location: '+l+'. Top 3 local news items. Each:\n[HEADLINE CAPS]\n[1-2 sentences]\nNo intro. Plain text. Max 150 words.',
    ai:'Today: '+DS+'. Top AI/startup news this week. Each:\n[HEADLINE CAPS]\n[2 sentences]\n2 breakthroughs, 2 funding rounds, 1 trend. No intro. Plain text. Max 200 words.'
  }[id];
}

var S={r:{},l:{},e:{},started:false,loc:null};

function setSt(ld,dn){
  var el=document.getElementById('sd');
  if(ld){el.style.color='#FF3C00';el.textContent='&#9679; FETCHING';}
  else if(dn){el.style.color='#000';el.textContent='&#9679; LIVE';}
  else{el.style.color='#999';el.textContent='&#9679; STANDBY';}
}
function mkDots(n,c){
  var h='';for(var i=0;i<n;i++) h+='<div class="dot" style="background:'+(i%3===0?(c||'#000'):'#ccc')+'"></div>';
  return '<div class="dots" style="display:flex;gap:5px">'+h+'</div>';
}
function rcon(text){
  return text.split('\n').map(function(line){
    var t=line.trim();
    var caps=t.length>3&&/^[A-Z][A-Z\s\d\-\+\&\/\.,!?:\(\)]+$/.test(t);
    return '<p class="'+(caps?'caps':'')+'">'+( t||'&nbsp;')+'</p>';
  }).join('');
}
function rcard(sec,i){
  var id=sec.id,label=sec.label,icon=sec.icon,acc=sec.acc;
  var ld=S.l[id],err=S.e[id],con=S.r[id],live=!ld&&con;
  var body='';
  if(err) body='<div class="er">'+err+'</div>';
  else if(ld) body='<div class="sk">'+[88,70,80,60,75].map(function(w,j){return '<div class="skl" style="width:'+w+'%;animation-delay:'+(j*.12)+'s"></div>';}).join('')+'</div>';
  else if(con) body='<div class="con">'+rcon(con)+'</div>';
  return '<div class="card'+(live?' live':'')+'" id="c-'+id+'" style="--acc:'+acc+';animation:fu .3s ease '+(i*.08)+'s both"><div class="ch" onclick="tog(\''+id+'\')"><div class="chl"><span class="ci" style="color:'+acc+';'+(ld?'animation:pu 1s ease-in-out infinite':'')+'">'+icon+'</span><span class="ct">'+label+'</span>'+(ld?'<span class="ctag" style="color:#888">LOADING_</span>':'')+(live?'<span class="ctag" style="color:'+acc+'">&#9679; LIVE</span>':'')+'</div><span class="ctog" id="t-'+id+'">&#8722;</span></div><div class="cb" id="b-'+id+'">'+body+'</div></div>';
}
function tog(id){
  var b=document.getElementById('b-'+id),t=document.getElementById('t-'+id);
  var h=b.style.display==='none';b.style.display=h?'':'none';t.innerHTML=h?'&#8722;':'+';
}
function rb(){
  var al=SECS.some(function(s){return S.l[s.id];});
  var ad=S.started&&!al&&SECS.every(function(s){return S.r[s.id]||S.e[s.id];});
  setSt(al,ad);
  if(!S.started){
    document.getElementById('bm').innerHTML='<div class="cta"><div style="margin-bottom:20px">'+mkDots(16,'#FF3C00')+'</div><div class="ey">GOOD MORNING_</div><div class="hl">Your intelligence<br>briefing awaits.</div><button class="gbtn" onclick="run()"><span>GENERATE BRIEFING</span><span class="arr">&#8594;</span></button><div class="csub">WEATHER &middot; WORLD &middot; LOCAL &middot; AI</div></div>';
    return;
  }
  var html='<div class="secs">';
  if(ad) html+='<div class="rrow"><button class="rbtn" onclick="run()">&#8635; REFRESH</button></div>';
  SECS.forEach(function(sec,i){html+=rcard(sec,i);});
  html+='<div class="ft">'+mkDots(20)+'<div class="ftl">POWERED BY CLAUDE &middot; '+now.getFullYear()+'</div></div></div>';
  document.getElementById('bm').innerHTML=html;
}

// Staggered fetch — 1.5s delay between each to avoid rate limit
async function fetchS(id,loc,delay){
  await new Promise(function(r){setTimeout(r,delay);});
  S.l[id]=true;S.e[id]=null;rb();
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':AK,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:500,messages:[{role:'user',content:getP(id,loc)}]})
    });
    var data=await res.json();
    if(data.error) throw new Error(data.error.message);
    var text=data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').trim();
    S.r[id]=text||'(no content)';
  }catch(e){S.e[id]=e.message||'Failed';}
  S.l[id]=false;rb();
}
async function run(){
  S.r={};S.e={};S.l={};S.started=true;
  SECS.forEach(function(s){S.l[s.id]=true;});rb();
  var loc=S.loc;
  if(!loc){try{await new Promise(function(res){navigator.geolocation.getCurrentPosition(function(p){loc='lat '+p.coords.latitude.toFixed(2)+', lon '+p.coords.longitude.toFixed(2);S.loc=loc;res();},res,{timeout:4000});});}catch(e){}}
  // Stagger: 0, 2000, 4000, 6000ms
  SECS.forEach(function(s,i){fetchS(s.id,loc,i*2000);});
}

// ── ASSISTANT ──
var hist=[];
var attachedFile=null;

function onFile(e){
  var f=e.target.files[0];if(!f)return;
  attachedFile=f;
  var icon=f.type.startsWith('image/')?'&#128247;':'&#128206;';
  document.getElementById('prevIcon').innerHTML=icon;
  document.getElementById('prevName').textContent=f.name+' ('+Math.round(f.size/1024)+'KB)';
  document.getElementById('prevBar').style.display='flex';
}
function clearFile(){
  attachedFile=null;
  document.getElementById('prevBar').style.display='none';
  document.getElementById('fileInput').value='';
}

function am(role,html,isHtml){
  var msgs=document.getElementById('am');
  var div=document.createElement('div');div.className='msg '+(role==='u'?'u':'a');
  if(role==='a') div.innerHTML='<div class="ml">ASSISTANT_</div>'+(isHtml?html:html.replace(/\n/g,'<br>'));
  else div.innerHTML=html;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;return div;
}
function showTy(){
  var msgs=document.getElementById('am');
  var div=document.createElement('div');div.className='msg a';div.id='ty';
  div.innerHTML='<div class="ml">ASSISTANT_</div><div class="ty"><span></span><span></span><span></span></div>';
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function rmTy(){var t=document.getElementById('ty');if(t)t.remove();}

async function send(){
  var inp=document.getElementById('ainp');
  var text=inp.value.trim();
  if(!text&&!attachedFile)return;
  inp.value='';

  // Build user message content
  var userContent=[];
  var displayHtml='';

  if(attachedFile){
    var f=attachedFile;
    var isImg=f.type.startsWith('image/');
    displayHtml='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">'+(isImg?'&#128247;':'&#128206;')+'</span><span>'+f.name+'</span></div>'+(text?'<div style="margin-top:6px">'+text+'</div>':'');
    // Read file
    var fileData=await new Promise(function(res){
      var r=new FileReader();
      r.onload=function(e){res(e.target.result);};
      if(isImg) r.readAsDataURL(f); else r.readAsText(f);
    });
    if(isImg){
      var b64=fileData.split(',')[1];
      userContent.push({type:'image',source:{type:'base64',media_type:f.type,data:b64}});
    } else {
      userContent.push({type:'text',text:'[File: '+f.name+']\n'+fileData.substring(0,8000)});
    }
    if(text) userContent.push({type:'text',text:text});
    clearFile();
  } else {
    displayHtml=text;
    userContent=text;
  }

  am('u',displayHtml,true);
  hist.push({role:'user',content:userContent});
  showTy();

  try{
    var sys='You are a smart personal assistant in the user Daily Brief app. Today is '+DS+'. Help with Google Calendar, Gmail, Drive, Docs, Sheets, Maps, YouTube and general questions. For live Google account data, tell them to ask at claude.ai where accounts are fully connected. Analyze any files or images shared. Be concise and direct.';
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':AK,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:800,system:sys,messages:hist})
    });
    var data=await res.json();rmTy();
    if(data.error) throw new Error(data.error.message);
    var reply=data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').trim();
    hist.push({role:'assistant',content:reply});
    am('a',reply,false);
  }catch(e){rmTy();am('a','ERR: '+e.message,false);}
}

// ── VOICE INPUT ──
var recog=null;var isRec=false;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();recog.continuous=false;recog.interimResults=true;recog.lang='en-US';
  recog.onresult=function(e){
    var t=Array.from(e.results).map(function(r){return r[0].transcript;}).join('');
    document.getElementById('ainp').value=t;
  };
  recog.onend=function(){
    isRec=false;
    document.getElementById('micBtn').classList.remove('rec');
    document.getElementById('micBtn').innerHTML='&#127908;';
  };
  recog.onerror=function(){isRec=false;document.getElementById('micBtn').classList.remove('rec');};
}
function toggleVoice(){
  if(!recog){alert('Voice not supported in this browser.');return;}
  if(isRec){recog.stop();isRec=false;document.getElementById('micBtn').classList.remove('rec');document.getElementById('micBtn').innerHTML='&#127908;';}
  else{recog.start();isRec=true;document.getElementById('micBtn').classList.add('rec');document.getElementById('micBtn').innerHTML='&#128308;';}
}

rb();
</script>
</body>
</html>
